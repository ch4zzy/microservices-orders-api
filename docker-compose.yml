services:
    orders-api:
        build:
            context: .
            dockerfile: Dockerfile
        volumes:
            - ./src:/app/src
            - ./alembic:/app/alembic
            - ./alembic.ini:/app/alembic.ini
        ports:
            - "5002:5000"
        env_file:
            - .env
        networks:
            - orders-api-network
            - observability-network

    postgres:
        image: postgres:18.1-alpine
        volumes:
            - postgres_data:/var/lib/postgresql/data
        env_file:
            - .env
        ports:
            - "5434:5432"
        networks:
            - orders-api-network

volumes:
    postgres_data:

networks:
    orders-api-network:
        driver: bridge

    observability-network:
        external: true
